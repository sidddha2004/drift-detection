# Model Architecture and Training Configuration
# LSTM-only architecture (MLP removed)

# LSTM model configuration (for temporal pattern recognition)
lstm:
  # Input: raw accelerometer (9 axes from 3 sensors)
  input_size: 9
  # Sequence length: 256 samples (2.56s @ 100Hz)
  seq_len: 256
  # LSTM architecture
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  bidirectional: false

  # Output: 18 activity classes
  output_dim: 18

  # Training hyperparameters (Adam optimizer)
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 20

  # Fine-tuning (during adaptation)
  adaptation_lr: 0.0005
  adaptation_epochs: 10

# ADWIN drift detector configuration
adwin:
  # Confidence parameter (lower = fewer false positives, higher latency)
  delta: 0.002
  # Maximum error buffer size
  max_buffer: 1000
  # Minimum samples before detection can trigger
  min_window: 30

# Running normalization parameters
normalization:
  # Decay factor for running mean/variance (0.95 = 5% new data weight)
  decay: 0.95
  # Epsilon for numerical stability
  epsilon: 1e-8

# Window configuration
window:
  # Window size in samples (2.56s @ 100Hz = 256)
  size: 256
  # Stride in samples (50% overlap = 128)
  stride: 128

# Feature extraction
features:
  # Statistics to compute per window per axis
  statistics: [mean, std, min, max, p25, p75]
