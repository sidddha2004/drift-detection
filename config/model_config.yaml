# Model Architecture and Training Configuration

mlp:
  # Input features: 3 axes × 3 sensors × 5 statistics = 45
  input_dim: 45
  # Hidden layer size
  hidden_dim: 32
  # Output: 18 activity classes (PAMAP2 IDs 1-24, excluding 0)
  output_dim: 18
  # Activation function
  activation: relu

  # Training hyperparameters
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001

  # Mini-batch settings
  batch_size: 32
  epochs_per_update: 5

  # Fine-tuning (during adaptation)
  adaptation_lr: 0.1
  adaptation_epochs: 10

# ADWIN drift detector configuration
adwin:
  # Confidence parameter (lower = fewer false positives, higher latency)
  delta: 0.002
  # Maximum error buffer size
  max_buffer: 1000
  # Minimum samples before detection can trigger
  min_window: 30

# Running normalization parameters
normalization:
  # Decay factor for running mean/variance (0.95 = 5% new data weight)
  decay: 0.95
  # Epsilon for numerical stability
  epsilon: 1e-8

# Window configuration
window:
  # Window size in samples (2.56s @ 100Hz = 256)
  size: 256
  # Stride in samples (50% overlap = 128)
  stride: 128

# Feature extraction
features:
  # Statistics to compute per window per axis
  statistics: [mean, std, min, max, p25, p75]
