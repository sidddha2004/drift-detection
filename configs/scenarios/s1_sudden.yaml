# S1: sudden drift. Step change at round `start` on all channels of the affected clients.
# coverage: number of affected clients (of 8) or "all". Timing is overridden at run time (fixed | random).
scenario: S1
n_rounds: 60
start: 20
timing: fixed
jitter: 5
variants:
  virtual_offset_partial:   {profile: sudden, mode: virtual, transform: offset,      coverage: 3}
  virtual_offset_full:      {profile: sudden, mode: virtual, transform: offset,      coverage: all}
  virtual_gain_partial:     {profile: sudden, mode: virtual, transform: gain,        coverage: 3}
  virtual_rotation_partial: {profile: sudden, mode: virtual, transform: rotation,    coverage: 3}
  real_partial:             {profile: sudden, mode: real,    transform: label_remap, coverage: 3}
  real_full:                {profile: sudden, mode: real,    transform: label_remap, coverage: all}
